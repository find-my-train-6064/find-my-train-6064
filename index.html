<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Mobile + Laptop responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find My Train</title>


    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Front / Splash Page -->
    <main class="splash-screen">

        <!-- Background image -->
        <div class="background-image"></div>

        <!-- Dark/blue overlay -->
        <div class="overlay"></div>

        <!-- Main content -->
        <section class="content">

            <div class="train-logo">
                <img src="LOGO FRONT PAGE.jpeg" alt="Find My Train">
            </div>

            <div class="title-box">
                <h1>Find My Train</h1>

                <p>
                    Live Train Status at Your Fingertips
                </p>
            </div>

            <button class="start-btn" onclick="startApp()">
                Get Started
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
